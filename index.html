<!doctype html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fotoğrafçılık Topluluğu · Yönetim</title>
  <meta name="description" content="Kırıkkale Üniversitesi Fotoğrafçılık Topluluğu etkinlik ve yönetim sistemi">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
/* Fotoğrafçılık Topluluğu Yönetim Sistemi — "karanlık oda" teması */
:root {
  --bg: #f5f2ec; --surface: #fffdf9; --surface2: #efeae1; --ink: #1d1a16; --muted: #6b645a; --line: #ded7ca;
  --accent: #b4560f; --accent-ink: #fff; --accent-soft: #f6e4d2;
  --ok: #2f7d4f; --warn: #9a6200; --bad: #b3342a; --info: #2c5f8a; --done: #5b5750;
  --side-bg: #1b1815; --side-ink: #e9e2d6; --side-muted: #a39a8b;
  --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 4px 14px rgb(0 0 0 / .05);
  --radius: 10px; --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
}
:root[data-theme='dark'] {
  --bg: #12110f; --surface: #1b1917; --surface2: #25221e; --ink: #efe9de; --muted: #a39a8b; --line: #36322b;
  --accent: #f0a64a; --accent-ink: #1a1206; --accent-soft: #3a2a14;
  --ok: #6fc08a; --warn: #e3b04a; --bad: #ef7b6e; --info: #7fb2e0; --done: #9b958a;
  --side-bg: #0c0b0a; --shadow: none;
}
* { box-sizing: border-box; }
html { color-scheme: light; } :root[data-theme='dark'] { color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-text-size-adjust: 100%; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
h1 { font-family: var(--serif); font-weight: 600; font-size: 1.75rem; }
h2 { font-size: 1.05rem; font-weight: 600; } h3 { font-size: 1rem; } h4 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 1.1rem 0 .4rem; font-weight: 600; }
a { color: var(--accent); } p { margin: .4rem 0; }
.muted { color: var(--muted); } .small { font-size: .82rem; } .neg { color: var(--bad); font-weight: 600; } .pos { color: var(--ok); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 0; background: var(--accent); color: var(--accent-ink); padding: .5rem 1rem; z-index: 100; }
.skip:focus { left: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.ic { flex: none; }

/* yerleşim */
.app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
.side { background: var(--side-bg); color: var(--side-ink); padding: 1.2rem .9rem; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 1.2rem; }
.brand { display: flex; gap: .6rem; align-items: center; color: var(--accent); padding: .2rem .4rem; }
:root[data-theme='light'] .brand { color: #f0a64a; }
.brand-name { font-family: var(--serif); font-size: 1.02rem; font-weight: 600; color: var(--side-ink); line-height: 1.2; }
.brand-logo { width: 34px; height: 34px; object-fit: contain; border-radius: 6px; background: #fff2; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-link { color: var(--side-muted); text-decoration: none; padding: .55rem .75rem; border-radius: 8px; font-weight: 500; }
.nav-link:hover { background: #ffffff10; color: var(--side-ink); }
.nav-link.on { background: #f0a64a22; color: #f6b862; box-shadow: inset 3px 0 0 #f0a64a; }
.side-foot { margin-top: auto; font-size: .75rem; color: var(--side-muted); padding: 0 .5rem; }
.content { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: .6rem; padding: .6rem 1.2rem; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 20; }
.topbar-spacer { flex: 1; } .auth { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.mode-pill, .user-pill { display: inline-flex; gap: .3rem; align-items: center; font-size: .78rem; padding: .2rem .6rem; border-radius: 99px; background: var(--surface2); color: var(--muted); border: 1px solid var(--line); }
.mode-pill.view { color: var(--info); } .user-pill { color: var(--ok); }
.banner { background: var(--accent-soft); border-bottom: 1px solid var(--line); padding: .5rem 1.2rem; font-size: .85rem; }
main { padding: 1.4rem 1.2rem 3rem; max-width: 1280px; width: 100%; margin: 0 auto; }
.menu-btn { display: none; } .scrim { display: none; }

.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.1rem; }
.page-head .sub { color: var(--muted); margin: .2rem 0 0; } .head-actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }

/* bileşenler */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; box-shadow: var(--shadow); margin-bottom: 1rem; min-width: 0; }
.card.inner { background: var(--bg); box-shadow: none; margin-top: .9rem; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: .6rem; margin-bottom: .7rem; flex-wrap: wrap; }
.card > .btn, .card > .field { margin-top: .6rem; }
.btn { display: inline-flex; align-items: center; gap: .4rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: .5rem .85rem; border-radius: 8px; font: inherit; font-weight: 500; cursor: pointer; min-height: 38px; }
.btn:hover { background: var(--surface2); } .btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); } .btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger-ghost { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.sm { padding: .3rem .65rem; min-height: 32px; font-size: .85rem; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--surface2); color: var(--ink); } .icon-btn.danger:hover { color: var(--bad); }
.btn-row { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .7rem; }
.link-btn { background: none; border: 0; padding: 0; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.link-btn:hover { color: var(--accent); text-decoration-color: var(--accent); }
.badge { display: inline-block; font-size: .72rem; font-weight: 600; padding: .12rem .55rem; border-radius: 99px; border: 1px solid transparent; margin: 0 .25rem .15rem 0; white-space: nowrap; }
.badge.muted, .badge.neutral { background: var(--surface2); color: var(--muted); border-color: var(--line); }
.badge.info { background: color-mix(in srgb, var(--info) 15%, transparent); color: var(--info); }
.badge.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.badge.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.badge.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.badge.done { background: var(--surface2); color: var(--done); text-decoration: line-through; text-decoration-thickness: 1px; }
.badge.sample { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
.badges { margin-top: .4rem; }
.progress { height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; min-width: 70px; }
.progress span { display: block; height: 100%; background: var(--ok); border-radius: 99px; } .progress.bad span { background: var(--bad); }
.ready { display: flex; flex-direction: column; gap: .25rem; font-weight: 600; } .ready.sm { font-size: .8rem; min-width: 80px; }
.alert { display: flex; gap: .6rem; align-items: flex-start; padding: .7rem .9rem; border-radius: var(--radius); margin-bottom: 1rem; border: 1px solid; }
.alert.warn { background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.alert.bad { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.empty { text-align: center; color: var(--muted); padding: 1.6rem 1rem; } .locked { text-align: center; color: var(--muted); padding: 1rem; display: grid; gap: .6rem; justify-items: center; }
.loading { display: flex; align-items: center; gap: .7rem; padding: 3rem 1rem; justify-content: center; color: var(--muted); }
.spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } } @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
.toasts { position: fixed; right: 1rem; bottom: 1rem; display: grid; gap: .5rem; z-index: 200; max-width: min(92vw, 380px); }
.toast { display: flex; gap: .5rem; align-items: flex-start; background: var(--ink); color: var(--bg); padding: .65rem .9rem; border-radius: 8px; box-shadow: 0 6px 20px rgb(0 0 0 / .25); }
.toast.error { background: var(--bad); color: #fff; }

/* kpi */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .8rem; margin-bottom: 1rem; }
.small-kpis { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .85rem 1rem; border-left: 3px solid var(--line); }
.kpi.ok { border-left-color: var(--ok); } .kpi.bad { border-left-color: var(--bad); } .kpi.warn { border-left-color: var(--warn); }
.kpi-label { font-size: .78rem; color: var(--muted); font-weight: 500; } .kpi-value { font-family: var(--serif); font-size: 1.55rem; font-weight: 600; margin: .1rem 0; overflow-wrap: anywhere; } .kpi-note { font-size: .78rem; color: var(--muted); }
.kpi.bad .kpi-value { color: var(--bad); }
.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 1rem; } .dash-grid .card { margin: 0; }
.cols-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 1rem; }
.settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 1rem; align-items: start; } .settings-grid .card { margin: 0; }

/* tablolar */
.table-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tbl th { text-align: left; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; padding: .5rem .6rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: .55rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tbody tr:hover { background: color-mix(in srgb, var(--surface2) 55%, transparent); }
tr.cancelled td { color: var(--muted); } tr.cancelled .link-btn { text-decoration: line-through; } tr.done td strong { text-decoration: line-through; color: var(--muted); }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .78rem; color: var(--muted); }
.row-actions { display: flex; gap: 0; justify-content: flex-end; white-space: nowrap; }
.result-count { color: var(--muted); font-size: .85rem; margin: 0 0 .5rem; }
.filters { display: flex; gap: .8rem; flex-wrap: wrap; align-items: flex-end; padding: .8rem 1rem; }
.filters .field { min-width: 150px; flex: 1 1 150px; margin: 0; }

/* form */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem 1rem; }
.field { display: flex; flex-direction: column; gap: .25rem; min-width: 0; } .field.full, .form-h.full { grid-column: 1 / -1; }
.field.inline { flex-direction: row; align-items: center; }
label { font-size: .82rem; font-weight: 600; } .req { color: var(--bad); }
input[type=text], input[type=search], input[type=number], input[type=date], input[type=time], input[type=month], input[type=email], input[type=password], select, textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .5rem .65rem; min-height: 40px; }
textarea { resize: vertical; } input:disabled, select:disabled, textarea:disabled { background: var(--surface2); color: var(--muted); }
[aria-invalid='true'] { border-color: var(--bad) !important; }
.inline-sel { min-height: 34px; padding: .25rem .5rem; width: auto; font-size: .85rem; }
.help { font-size: .76rem; color: var(--muted); } .field-err { color: var(--bad); font-size: .8rem; min-height: 0; } .field-err:empty { display: none; }
.form-error { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); color: var(--bad); border: 1px solid var(--bad); padding: .5rem .75rem; border-radius: 8px; margin-bottom: .8rem; }
.form-h { font-size: .85rem; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: .25rem; margin-top: .6rem; text-transform: uppercase; letter-spacing: .05em; }
.form-actions { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1.1rem; }
.intro { color: var(--muted); }
.check { display: flex; gap: .5rem; align-items: center; font-weight: 400; font-size: .9rem; cursor: pointer; } .check input { width: 18px; height: 18px; accent-color: var(--accent); } .check.inline { padding-bottom: .55rem; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .3rem .8rem; border: 1px solid var(--line); border-radius: 8px; padding: .6rem; max-height: 180px; overflow: auto; }
.confirm-msg { margin: 0 0 .5rem; }

/* diyalog */
dialog.dlg { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); width: min(94vw, 640px); max-height: 92vh; box-shadow: 0 20px 60px rgb(0 0 0 / .35); }
dialog.dlg.sm { width: min(94vw, 420px); } dialog.dlg.lg { width: min(94vw, 820px); } dialog.dlg.xl { width: min(96vw, 980px); }
dialog.dlg::backdrop { background: rgb(10 8 5 / .55); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .8rem 1rem; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; border-radius: 14px 14px 0 0; }
.dlg-head h2 { flex: 1; font-family: var(--serif); font-size: 1.15rem; } .dlg-body { padding: 1rem; overflow-y: auto; max-height: calc(92vh - 60px); }

/* ayrıntı */
.detail-top { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; align-items: flex-start; } .detail-title { font-family: var(--serif); font-size: 1.5rem; }
.detail-actions { display: flex; gap: .4rem; flex-wrap: wrap; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: .7rem 1.2rem; margin: 1rem 0; } .facts dt { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; } .facts dd { margin: .1rem 0 0; overflow-wrap: anywhere; }
.plain { margin: 0; padding-left: 1.1rem; } .pre { white-space: pre-wrap; }
.task-mini { list-style: none; padding: 0; margin: 0; } .task-mini li { display: flex; gap: .6rem; align-items: center; padding: .35rem 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; } .task-mini li.done .check span { text-decoration: line-through; color: var(--muted); } .task-mini .meta { margin-left: auto; font-size: .8rem; color: var(--muted); }
.agenda, .log, .lookups, .undated { list-style: none; padding: 0; margin: 0; }
.agenda li { display: grid; grid-template-columns: 110px 1fr auto auto; gap: .7rem; padding: .6rem 0; border-bottom: 1px solid var(--line); align-items: center; } .agenda-date { font-weight: 600; font-size: .85rem; }
.log li { padding: .45rem 0; border-bottom: 1px solid var(--line); } .lookups li { display: flex; justify-content: space-between; align-items: center; padding: .2rem 0; border-bottom: 1px solid var(--line); }
.undated-item { display: flex; justify-content: space-between; gap: .8rem; padding: .55rem 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; } .undated-set { display: flex; gap: .4rem; align-items: center; } .undated-set input { width: auto; min-height: 34px; }
.logo-prev { max-width: 120px; max-height: 80px; object-fit: contain; margin-bottom: .6rem; }

/* takvim */
.cal-bar { display: flex; justify-content: space-between; align-items: center; gap: .8rem; flex-wrap: wrap; margin-bottom: .7rem; } .cal-nav { display: flex; align-items: center; gap: .3rem; } .cal-title { font-family: var(--serif); font-size: 1.25rem; min-width: 11rem; text-align: center; }
.segs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; } .seg { border: 0; background: var(--surface); color: var(--ink); padding: .4rem .85rem; cursor: pointer; font: inherit; font-weight: 500; min-height: 36px; } .seg.on { background: var(--accent); color: var(--accent-ink); } .seg + .seg { border-left: 1px solid var(--line); }
.cal-grid { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.cal-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); } .cal-dow > div { text-align: center; font-size: .75rem; font-weight: 600; color: var(--muted); padding: .4rem; background: var(--surface2); }
.cal-cell { min-height: 104px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); padding: .25rem; display: flex; flex-direction: column; gap: 2px; min-width: 0; } .cal-cell:nth-child(7n+1) { border-left: 0; }
.cal-cell.other { background: color-mix(in srgb, var(--surface2) 60%, transparent); color: var(--muted); } .cal-cell.today .cal-num { background: var(--accent); color: var(--accent-ink); border-radius: 99px; } .cal-cell.drop, .week-col.drop, .board-col.drop { outline: 2px dashed var(--accent); outline-offset: -3px; } .cal-cell.has-conf { box-shadow: inset 0 0 0 1px var(--warn); }
.cal-num { font-size: .78rem; font-weight: 600; width: 1.5rem; height: 1.5rem; display: grid; place-items: center; }
.chip { display: flex; gap: .25rem; align-items: center; text-align: left; width: 100%; border: 0; border-left: 3px solid var(--muted); background: var(--surface2); color: var(--ink); font: inherit; font-size: .75rem; padding: 2px 5px; border-radius: 4px; cursor: pointer; overflow: hidden; }
.chip:hover { filter: brightness(.96); } .chip-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .chip-time { font-weight: 600; flex: none; }
.chip.tone-info { border-color: var(--info); } .chip.tone-warn { border-color: var(--warn); } .chip.tone-ok { border-color: var(--ok); } .chip.tone-bad { border-color: var(--bad); } .chip.tone-done { border-color: var(--done); }
.chip.finished { opacity: .65; } .chip.cancelled { opacity: .6; text-decoration: line-through; }
.more { border: 0; background: none; color: var(--accent); font-size: .74rem; cursor: pointer; text-align: left; padding: 0 4px; }
.week-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .5rem; } .week-col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .5rem; display: flex; flex-direction: column; gap: 4px; min-height: 180px; } .week-col.today { border-color: var(--accent); } .week-head { display: flex; flex-direction: column; font-size: .8rem; margin-bottom: .3rem; }
.legend { display: flex; gap: 1rem; flex-wrap: wrap; margin: .8rem 0; align-items: center; } .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; background: var(--muted); } .dot.tone-info { background: var(--info); } .dot.tone-warn { background: var(--warn); } .dot.tone-ok { background: var(--ok); } .dot.tone-bad { background: var(--bad); } .dot.tone-done { background: var(--done); }
.mc { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; } .mc-title { font-weight: 600; margin-bottom: .4rem; } .mc-dow { font-size: .7rem; color: var(--muted); } .mc-day { aspect-ratio: 1; display: grid; place-items: center; font-size: .8rem; border-radius: 6px; border: 0; background: none; color: var(--ink); font-family: inherit; } .mc-day.other { color: var(--muted); opacity: .5; } .mc-day.today { outline: 1px solid var(--accent); } .mc-day.has { background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; opacity: 1; }

/* grafik */
.chart .bars { display: flex; gap: .5rem; align-items: flex-end; height: 160px; border-bottom: 1px solid var(--line); padding-top: 14px; } .bar-group { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; min-width: 0; align-items: stretch; } .bar-stack { display: flex; gap: 3px; align-items: flex-end; height: 100%; justify-content: center; } .bar { flex: 1; max-width: 34px; border-radius: 4px 4px 0 0; position: relative; } .bar.b1 { background: var(--accent); } .bar-val { position: absolute; top: -16px; left: 0; right: 0; text-align: center; font-size: .72rem; color: var(--muted); } .bar-label { text-align: center; font-size: .72rem; color: var(--muted); margin-top: 4px; }

/* kanban, ekip */

/* js/util.js */
/* Yardımcılar: DOM üretimi (güvenli, innerHTML yok), Türkiye biçimleri, tarih işlemleri, dışa aktarma */
'use strict';
const U = (() => {
  const MONTHS = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
  const DAYS_SHORT = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
  const DAYS_LONG = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'];
  const collator = new Intl.Collator('tr');
  const numFmt = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 2 });

  const pad = (n) => String(n).padStart(2, '0');
  const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = (s) => {
    if (!s) return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  };
  const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
  const todayISO = () => iso(new Date());
  const fmtDate = (s) => { const d = parse(s); return d ? `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}` : '—'; };
  const fmtDateLong = (s) => { const d = parse(s); return d ? `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}` : '—'; };
  const fmtMonth = (ym) => {
    const m = /^(\d{4})-(\d{2})/.exec(ym || '');
    return m ? `${MONTHS[+m[2] - 1]} ${m[1]}` : '—';
  };
  const fmtNum = (n) => (n === null || n === undefined || n === '' || isNaN(n)) ? '—' : numFmt.format(Number(n));
  const fmtDateTime = (s) => {
    const d = new Date(s);
    if (isNaN(d)) return '';
    return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const weekStart = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return x; };
  const sortTr = (a, b) => collator.compare(a || '', b || '');
  const uid = (p = 'id') => {
    try { if (crypto && crypto.randomUUID) return p + '-' + crypto.randomUUID().slice(0, 12); } catch (e) { /* yoksay */ }
    return p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  };
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const isUrl = (s) => { try { const u = new URL(s); return u.protocol === 'http:' || u.protocol === 'https:'; } catch (e) { return false; } };
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

  /** Güvenli DOM oluşturucu: metinler textContent olarak eklenir, HTML enjekte edilemez. */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    const props = {};
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v === undefined || v === null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'value' || k === 'checked' || k === 'selected' || k === 'disabled') props[k] = v;
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else el.setAttribute(k, v === true ? '' : String(v));

      if (k === null || k === undefined || k === false) return;
      if (Array.isArray(k)) k.forEach(add);
      else el.append(k instanceof Node ? k : document.createTextNode(String(k)));

    kids.forEach(add);
    for (const [k, v] of Object.entries(props)) el[k] = v;
    return el;
  }
  /** Güvenli ekleme: null/false atlanır, diziler düzleştirilir (yerel append bunları metne çevirirdi). */
  function put(el, ...kids) {
    const add = (k) => { if (k === null || k === undefined || k === false) return; if (Array.isArray(k)) k.forEach(add); else el.append(k instanceof Node ? k : document.createTextNode(String(k))); };
    kids.forEach(add); return el;
  }
  const clear = (el) => { while (el.firstChild) el.removeChild(el.firstChild); return el; };

  // ---- Dışa aktarma ----
  function csvCell(v) {
    const s = v === null || v === undefined ? '' : String(v);
    return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  /** Türkçe Excel uyumlu CSV: ayraç ';' ve UTF-8 BOM */
  const toCSV = (columns, rows) => '﻿' + [columns, ...rows].map((r) => r.map(csvCell).join(';')).join('\r\n');

    const blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    const a = h('a', { href: URL.createObjectURL(blob), download: filename });

  }

  let xlsxPromise = null;
  function loadXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (!xlsxPromise) {
      xlsxPromise = new Promise((resolve, reject) => {
        const s = h('script', { src: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', crossorigin: 'anonymous' });

  }
  /** sheets: [{name, columns, rows}] */
  async function downloadXLSX(filename, sheets) {
    const X = await loadXLSX();
    const wb = X.utils.book_new();
    sheets.forEach((s) => {
      const ws = X.utils.aoa_to_sheet([s.columns, ...s.rows]);
      ws['!cols'] = s.columns.map((c, i) => ({ wch: Math.min(48, Math.max(String(c).length, ...s.rows.slice(0, 60).map((r) => String(r[i] ?? '').length)) + 2) }));
      X.utils.book_append_sheet(wb, ws, s.name.replace(/[\\/?*[\]:]/g, ' ').slice(0, 31));
    });
    X.writeFile(wb, filename);
  }

  return { MONTHS, DAYS_SHORT, DAYS_LONG, pad, iso, parse, addDays, todayISO, fmtDate, fmtDateLong, fmtMonth, fmtNum, fmtDateTime, weekStart, sortTr, uid, clone, isUrl, debounce, h, put, clear, toCSV, download, downloadXLSX, slug };
})();

/* Veri katmanı.

    supports: ['id', 'event_id', 'title', 'unit', 'request_date', 'status', 'description', 'is_sample', 'created_at', 'updated_at'],

    await applySession(session);
    await reloadAll();

      const uid = s && s.user ? s.user.id : null;

    });

  }

  async function reloadAll() {

    const none = Promise.resolve({ data: [] });

    if (e && e.code === '23505') return 'Aynı değere sahip bir kayıt zaten var (örneğin etkinlik numarası).';

    if (/email rate limit|over_email_send_rate_limit/i.test(m)) return 'Çok fazla deneme yapıldı. Birkaç dakika sonra tekrar deneyin.';
    if (/error sending confirmation email|email not confirmed/i.test(m)) return 'E-posta onayı açık olduğu için hesap açılamadı. Yöneticinin Supabase\'de "Confirm email" seçeneğini kapatması gerekir.';
    if (/SON_YONETICI/.test(m)) return 'En az bir yönetici kalmalı; son yöneticiyi kaldıramaz veya rolünü değiştiremezsiniz.';
    if (/HESAP_YOK/.test(m)) return 'Bu e-postayla henüz hesap açılmamış; şifre ancak hesap açıldıktan sonra sıfırlanabilir.';

  const loading = (msg = 'Yükleniyor…') => h('div', { class: 'loading', role: 'status' }, h('span', { class: 'spinner' }), msg);

  // ---- form üretici ----
  /**
   * fields: {key,label,type,required,options,help,min,max,step,placeholder,rows,full,disabled}
   * type: text textarea number date time month select checkboxes lines links checkbox heading
   */
  function form({ title, fields, values = {}, submitLabel = 'Kaydet', size = 'md', validate, onSubmit, intro, onClose }) {
    const getters = {};
    const errBoxes = {};
    const controls = {};
    const grid = h('div', { class: 'form-grid' });
    const banner = h('div', { class: 'form-error', role: 'alert', hidden: true });
    const seq = Math.random().toString(36).slice(2, 7);

    fields.forEach((f) => {
      if (f.type === 'heading') { grid.append(h('h3', { class: 'form-h full' }, f.label)); return; }
      const id = `f-${f.key}-${seq}`;
      const v = values[f.key];
      let ctl;
      switch (f.type) {
        case 'textarea':
          ctl = h('textarea', { id, rows: f.rows || 3, value: v == null ? '' : v, placeholder: f.placeholder, maxlength: f.maxlength || 4000, disabled: f.disabled });
          getters[f.key] = () => ctl.value.trim(); break;
        case 'lines':
          ctl = h('textarea', { id, rows: f.rows || 4, value: Array.isArray(v) ? v.join('\n') : '', placeholder: f.placeholder || 'Her satıra bir madde', disabled: f.disabled });
          getters[f.key] = () => ctl.value.split('\n').map((s) => s.trim()).filter(Boolean); break;
        case 'links':
          ctl = h('textarea', { id, rows: f.rows || 3, value: Array.isArray(v) ? v.map((a) => `${a.title} | ${a.url}`).join('\n') : '', placeholder: 'Başlık | https://bağlantı (her satıra bir bağlantı)', disabled: f.disabled });
          getters[f.key] = () => ctl.value.split('\n').map((s) => s.trim()).filter(Boolean).map((line) => {
            const i = line.lastIndexOf('|');
            const t = i >= 0 ? line.slice(0, i).trim() : '';
            const u = (i >= 0 ? line.slice(i + 1) : line).trim();
            return { title: t || u, url: u };
          }); break;
        case 'select': {
          const opts = (f.options || []).map((o) => opt(o.value, o.label, String(o.value) === String(v == null ? '' : v)));
          if (!f.required) opts.unshift(opt('', f.emptyLabel || '— Seçiniz —', v == null || v === ''));
          ctl = h('select', { id, disabled: f.disabled }, opts);
          getters[f.key] = () => (ctl.value === '' ? null : ctl.value); break;
        }
        case 'checkboxes': {
          const set = new Set(Array.isArray(v) ? v : []);
          const boxes = (f.options || []).map((o) => h('label', { class: 'check' }, h('input', { type: 'checkbox', value: o.value, checked: set.has(o.value) }), h('span', null, o.label)));
          ctl = h('div', { class: 'checks', role: 'group', 'aria-labelledby': id + '-l' }, boxes.length ? boxes : h('span', { class: 'muted' }, 'Seçenek yok'));
          getters[f.key] = () => [...ctl.querySelectorAll('input:checked')].map((i) => i.value); break;
        }
        case 'checkbox':
          ctl = h('label', { class: 'check' }, h('input', { type: 'checkbox', id, checked: !!v }), h('span', null, f.checkLabel || f.label));
          getters[f.key] = () => ctl.querySelector('input').checked; break;
        case 'number':
          ctl = h('input', { id, type: 'number', inputmode: 'decimal', value: v == null ? '' : v, min: f.min, max: f.max, step: f.step || 'any', placeholder: f.placeholder, disabled: f.disabled });
          getters[f.key] = () => (ctl.value === '' ? null : Number(ctl.value)); break;
        case 'date': case 'time': case 'month':
          ctl = h('input', { id, type: f.type, value: v || '', min: f.min, max: f.max, disabled: f.disabled });
          getters[f.key] = () => (ctl.value === '' ? null : ctl.value); break;
        default:
          ctl = h('input', { id, type: f.type === 'password' ? 'password' : f.type === 'email' ? 'email' : 'text', value: v == null ? '' : v, placeholder: f.placeholder, maxlength: f.maxlength || 300, autocomplete: f.autocomplete || 'off', disabled: f.disabled });
          getters[f.key] = () => ctl.value.trim();
      }
      controls[f.key] = ctl;
      const err = h('div', { class: 'field-err', id: id + '-e', role: 'alert' });
      errBoxes[f.key] = err;
      const showLabel = f.type !== 'checkbox';
      grid.append(h('div', { class: 'field' + (f.full ? ' full' : '') },
        showLabel ? h('label', { for: f.type === 'checkboxes' ? null : id, id: id + '-l' }, f.label, f.required ? h('span', { class: 'req', 'aria-hidden': 'true' }, ' *') : null) : null,
        ctl, f.help ? h('div', { class: 'help' }, f.help) : null, err));
    });

    const submit = h('button', { class: 'btn primary', type: 'submit' }, submitLabel);
    const cancel = h('button', { class: 'btn', type: 'button', onclick: () => dlg.close() }, 'Vazgeç');
    const formEl = h('form', { class: 'form', novalidate: true }, intro ? h('p', { class: 'intro' }, intro) : null, banner, grid, h('div', { class: 'form-actions' }, cancel, submit));

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      banner.hidden = true;
      const out = {}; const errors = {};
      fields.forEach((f) => {
        if (f.type === 'heading') return;
        const val = getters[f.key]();
        out[f.key] = val;
        const empty = val === null || val === '' || (Array.isArray(val) && !val.length);
        if (f.required && empty && f.type !== 'checkbox') errors[f.key] = 'Bu alan zorunludur.';
        else if (f.type === 'number' && val !== null) {
          if (!Number.isFinite(val)) errors[f.key] = 'Geçerli bir sayı girin.';
          else if (f.min !== undefined && val < f.min) errors[f.key] = `En az ${f.min} olmalı.`;
          else if (f.max !== undefined && val > f.max) errors[f.key] = `En fazla ${f.max} olabilir.`;
          else if (f.integer && !Number.isInteger(val)) errors[f.key] = 'Tam sayı girin.';
        } else if (f.type === 'links' && Array.isArray(val)) {
          const bad = val.find((a) => !U.isUrl(a.url));
          if (bad) errors[f.key] = `Geçersiz bağlantı: "${bad.url}". http:// veya https:// ile başlamalı.`;
        } else if (f.type === 'url' && val && !U.isUrl(val)) errors[f.key] = 'Geçerli bir bağlantı girin (https://…).';
        if (f.type === 'text' && f.isUrl && val && !U.isUrl(val)) errors[f.key] = 'Geçerli bir bağlantı girin (https://…).';
        if (f.type === 'email' && val && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(val)) errors[f.key] = 'Geçerli bir e-posta adresi girin.';
      });
      if (validate) Object.assign(errors, validate(out) || {});
      Object.values(errBoxes).forEach((b) => { b.textContent = ''; });
      Object.values(controls).forEach((c) => c.removeAttribute && c.removeAttribute('aria-invalid'));
      const keys = Object.keys(errors);
      if (keys.length) {
        keys.forEach((k) => { if (errBoxes[k]) errBoxes[k].textContent = errors[k]; if (controls[k]) controls[k].setAttribute('aria-invalid', 'true'); });
        const first = controls[keys[0]];
        if (first) (first.matches('input,select,textarea') ? first : first.querySelector('input') || first).focus();
        banner.textContent = 'Lütfen işaretli alanları düzeltin.'; banner.hidden = false;
        return;
      }
      submit.disabled = true; submit.textContent = 'Kaydediliyor…';
      try { await onSubmit(out); dlg.close(); }
      catch (err) {
        banner.textContent = (err && err.message) ? Store.friendly(err) : 'Kaydedilemedi.'; banner.hidden = false;
        submit.disabled = false; submit.textContent = submitLabel;
      }
    });

    const dlg = dialog({ title, content: formEl, size, onClose });
    const firstInput = dlg.querySelector('input:not([type=checkbox]),select,textarea');
    if (firstInput) firstInput.focus();
    return dlg;
  }

  // ---- tablo / bağlantı / yazdırma yardımcıları ----
  /** Dar ekranda kart görünümüne dönüşen tablo hücresi (data-label) */
  const td = (label, ...kids) => h('td', { 'data-label': label }, ...kids);
  const table = (headers, rows, cls = '') => h('div', { class: 'table-wrap' },
    h('table', { class: 'tbl resp ' + cls }, h('thead', null, h('tr', null, headers.map((x) => h('th', { scope: 'col' }, x)))), h('tbody', null, rows)));
  /** Yalnızca http(s) bağlantıları tıklanabilir yapılır (javascript: vb. engellenir) */
  const link = (url, text) => U.isUrl(url)
    ? h('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, text || url)
    : h('span', null, text || url);
  /** Düğümü yalnızca yazdırma çıktısında görünen bir kök içine koyar ve yazdırma penceresini açar. */
  function printNode(node) {
    const old = document.getElementById('print-root');
    if (old) old.remove();
    const root = h('div', { id: 'print-root' }, node);
    document.body.append(root);
    setTimeout(() => window.print(), 60);
  }

  return { icon, toast, dialog, liveDialog, confirmBox, confirmDelete, badge, statusBadge, progress, btn, iconBtn, empty, loading, pageHead, card, kpi, opt, form, td, table, link, printNode };
})();

  // ---------- form ----------
  function eventForm(ev, { quick = false, preset = {} } = {}) {

      { key: 'month_hint', label: 'Planlanan ay', type: 'month' },
    ] : [
      { type: 'heading', label: 'Temel bilgiler' },
      { key: 'title', label: 'Etkinlik adı', type: 'text', required: true, full: true },

      { key: 'description', label: 'Açıklama', type: 'textarea', full: true },
      { key: 'purpose', label: 'Amaç', type: 'textarea', full: true, rows: 2 },
      { type: 'heading', label: 'Zaman ve yer' },
      { key: 'start_date', label: 'Başlangıç tarihi', type: 'date' },
      { key: 'end_date', label: 'Bitiş tarihi', type: 'date', help: 'Tek günlük etkinliklerde boş bırakılabilir.' },
      { key: 'month_hint', label: 'Planlanan ay (tarih kesin değilse)', type: 'month', help: 'Başlangıç tarihi girilirse bu alan kullanılmaz.' },
      { key: 'start_time', label: 'Başlangıç saati', type: 'time' },
      { key: 'end_time', label: 'Bitiş saati', type: 'time' },
      { key: 'venue', label: 'Mekân', type: 'text' },
      { key: 'city', label: 'Şehir', type: 'text' },
      { type: 'heading', label: 'Katılım ve ekip' },
      { key: 'est_participants', label: 'Tahmini katılımcı sayısı', type: 'number', min: 0, integer: true },
      { key: 'actual_participants', label: 'Gerçek katılımcı sayısı', type: 'number', min: 0, integer: true },
      { key: 'lead_id', label: 'Sorumlu yönetici', type: 'select', options: memberOpts() },
      { key: 'support_ids', label: 'Destek ekibi', type: 'checkboxes', options: memberOpts(), full: true },
      { type: 'heading', label: 'Hazırlık ve değerlendirme' },
      { key: 'materials', label: 'Gerekli malzemeler', type: 'lines' },

const TasksView = (() => {
  const { h, clear } = U;
  const f = { mode: 'list', q: '', event: '', assignee: '', status: '', priority: '', category: '', overdue: false };

  const eventOpts = () => Calc.sortEvents(Calc.activeEvents()).map((e) => ({ value: e.id, label: `${e.code} · ${e.title}` }));
  const memberOpts = () => Store.D().members.map((m) => ({ value: m.id, label: m.name + ' — ' + m.role_title }));

  function taskForm(t, preset = {}) {
    if (!Store.can('edit')) return UI.toast('Düzenleme yetkiniz yok.', 'error');
    const isNew = !t;
    return UI.form({
      title: isNew ? 'Yeni görev' : 'Görevi düzenle',
      values: t || { status: 'Yapılacak', priority: 'Orta', ...preset },
      fields: [
        { key: 'title', label: 'Görev', type: 'text', required: true, full: true },
        { key: 'event_id', label: 'Etkinlik', type: 'select', options: eventOpts(), emptyLabel: '— Genel görev (etkinliğe bağlı değil) —', full: true },
        { key: 'assignee_id', label: 'Sorumlu kişi', type: 'select', options: memberOpts() },
        { key: 'due_date', label: 'Son teslim tarihi', type: 'date' },
        { key: 'priority', label: 'Öncelik', type: 'select', required: true, options: C.PRIORITY.map((p) => ({ value: p, label: p })) },
        { key: 'status', label: 'Durum', type: 'select', required: true, options: C.TASK_STATUS.map((p) => ({ value: p, label: p })) },
        { key: 'category_id', label: 'Kategori', type: 'select', options: Store.lookups('task_category').map((l) => ({ value: l.id, label: l.name })) },
        { key: 'notes', label: 'Not', type: 'textarea', full: true, rows: 2 },
      ],
      onSubmit: async (v) => {
        const rec = { ...v, id: t ? t.id : U.uid('tk') };
        if (isNew) Object.assign(rec, { sort: 0, is_sample: false, created_at: new Date().toISOString() });
        await Store.save('tasks', rec, { log: `${isNew ? 'Görev eklendi' : 'Görev güncellendi'}: ${v.title}` });

      },

  }

    const t = Store.get('tasks', id); if (!t || t.status === status) return;
    try { await Store.save('tasks', { id, status }, { log: `Görev durumu: ${t.title} → ${status}` }); } catch (e) { /* Store bildirdi */ }
  }

    document.body.append(inp); inp.click(); setTimeout(() => inp.remove(), 60000);
  }
  function lookupForm(kind, l) {
    UI.form({
      title: l ? 'Adı düzenle' : 'Yeni ekle', size: 'sm', values: l || {},
      fields: [{ key: 'name', label: 'Ad', type: 'text', required: true }],
      validate: (v) => Store.lookups(kind).some((x) => x.name.toLocaleLowerCase('tr') === (v.name || '').toLocaleLowerCase('tr') && (!l || x.id !== l.id)) ? { name: 'Bu ad zaten var.' } : {},
      onSubmit: async (v) => { await Store.save('lookups', { id: l ? l.id : U.uid('lk'), kind, name: v.name, sort: l ? l.sort : Store.D().lookups.filter((x) => x.kind === kind).length }, { log: `Liste öğesi ${l ? 'güncellendi' : 'eklendi'}: ${v.name}` }); UI.toast('Kaydedildi.'); },
    });
  }
  async function lookupDel(l) {
    if (Store.lookupInUse(l.id)) return UI.toast(`"${l.name}" kayıtlarda kullanılıyor; önce o kayıtları başka bir değere taşıyın.`, 'error');
    if (!(await UI.confirmDelete(`"${l.name}" silinecek.`))) return;
    await Store.remove('lookups', l.id, { log: `Liste öğesi silindi: ${l.name}` }); UI.toast('Silindi.');
  }

  function datasets() {
    const D = Store.D(); const internal = Store.internal();
    const sets = [
      { key: 'etkinlikler', name: 'Etkinlikler', columns: ['No', 'Etkinlik', 'Tür', 'Durum', 'Başlangıç', 'Bitiş', 'Planlanan ay', 'Saat', 'Mekân', 'Şehir', 'Tahmini katılımcı', 'Gerçek katılımcı', 'Sorumlu', 'Destek ekibi', 'İzin/onay', 'Hazırlık %', 'Malzemeler', 'Üniversite destekleri', 'Değerlendirme', 'Notlar', 'Arşivli'],
        rows: D.events.map((e) => { const p = Calc.readiness(e); return [e.code, e.title, Calc.lookupName(e.type_id), e.status, U.fmtDate(e.start_date), U.fmtDate(e.end_date), e.month_hint || '', Calc.timeLabel(e), e.venue, e.city, e.est_participants, e.actual_participants, Calc.memberName(e.lead_id), (e.support_ids || []).map(Calc.memberName).join(', '), e.approval, p === null ? '' : p, (e.materials || []).join('; '), (e.univ_supports || []).join('; '), e.evaluation, e.notes, e.archived ? 'Evet' : 'Hayır']; }) },
      { key: 'gorevler', name: 'Görevler', columns: ['Görev', 'Etkinlik', 'Sorumlu', 'Son tarih', 'Öncelik', 'Durum', 'Kategori', 'Not'],
        rows: D.tasks.map((t) => [t.title, t.event_id ? Calc.eventTitle(t.event_id) : 'Genel', Calc.memberName(t.assignee_id), U.fmtDate(t.due_date), t.priority, t.status, Calc.lookupName(t.category_id), t.notes]) },
      { key: 'yonetim-kurulu', name: 'Yönetim kurulu', columns: ['Ad', 'Görev', 'Sorumluluklar'], rows: D.members.map((m) => [m.name, m.role_title, (m.responsibilities || []).join('; ')]) },
    ];
    if (internal) {
      sets.push({ key: 'destekler', name: 'Destek talepleri', columns: ['Destek', 'Birim', 'Etkinlik', 'Tarih', 'Durum', 'Açıklama'], rows: D.supports.map((s) => [s.title, s.unit, s.event_id ? Calc.eventTitle(s.event_id) : '', U.fmtDate(s.request_date), s.status, s.description]) });
    }
    return sets;
  }

  function importJSON() {
    const inp = h('input', { type: 'file', accept: 'application/json,.json', hidden: true });
    inp.addEventListener('change', async () => {
      const file = inp.files[0]; if (!file) return;
      try {
        const obj = JSON.parse(await file.text());
        const nd = Store.validateBackup(obj);
        const remote = Store.state.mode === 'remote';
        const ok = await UI.confirmBox({ title: 'Yedekten geri yükle', danger: !remote, okLabel: 'Geri yükle',
          message: `Yedekte ${nd.events.length} etkinlik, ${nd.tasks.length} görev, ${nd.supports.length} destek talebi, ${nd.members.length} üye var (${obj.exported_at ? U.fmtDateTime(obj.exported_at) : 'tarih yok'}). ` + (remote ? 'Ortak veritabanında aynı kimlikli kayıtlar güncellenir, yedekte olmayan kayıtlar silinmez.' : 'Bu cihazdaki mevcut TÜM veriler yedekle değiştirilecek. Önce mevcut verinin yedeğini almanız önerilir.') });
        if (!ok) return;
        await Store.restore(obj); UI.toast('Yedek geri yüklendi.');
      } catch (e) { UI.toast(e instanceof SyntaxError ? 'Dosya okunamadı: geçerli bir JSON değil.' : e.message, 'error'); }
    });
    document.body.append(inp); inp.click(); setTimeout(() => inp.remove(), 60000);
  }

  function render(root) {
    const admin = Store.can('admin'), internal = Store.internal(), s = Store.settings();
    const remote = Store.state.mode === 'remote';
    const sampleN = Store.sampleCount();
    U.put(root, 
      UI.pageHead('Ayarlar ve veri yönetimi'),
      h('div', { class: 'settings-grid' },
        UI.card('Topluluk', h('div', null,
          s.logo_url ? h('img', { class: 'logo-prev', src: s.logo_url, alt: 'Topluluk logosu' }) : null,
          h('dl', { class: 'facts' }, [['Ad', s.name], ['Akademik yıl', s.academic_year], ['Danışman', s.advisor], ['Silme onayı', s.confirm_delete === false ? 'Kapalı' : 'Açık']].map(([k, v]) => h('div', null, h('dt', null, k), h('dd', null, v || '—')))),
          admin ? h('div', { class: 'btn-row' }, UI.btn('Düzenle', { ic: 'edit', onclick: profileForm }), UI.btn('Logo yükle', { ic: 'upload', onclick: logoPick }), s.logo_url ? UI.btn('Logoyu kaldır', { onclick: () => Store.saveSettings({ logo_url: '' }, 'Logo kaldırıldı') }) : null) : h('p', { class: 'muted small' }, 'Bu ayarları yalnızca yönetici düzenleyebilir.'))),
        UI.card('Görünüm', h('div', null, h('p', null, 'Açık veya koyu tema seçin. Tercih bu cihazda saklanır.'), h('div', { class: 'btn-row' }, UI.btn('Açık tema', { ic: 'sun', onclick: () => App.setTheme('light') }), UI.btn('Koyu tema', { ic: 'moon', onclick: () => App.setTheme('dark') })))),
        UI.card('Bağlantı ve hesap', h('dl', { class: 'facts' }, [
          ['Çalışma modu', remote ? 'Ortak mod (Supabase veritabanı)' : 'Yerel prototip modu (yalnızca bu cihaz)'],
          remote ? ['Oturum', Store.state.user ? `${Store.state.user.email} — ${Store.state.role ? ({ admin: 'Yönetici', editor: 'Editör', viewer: 'Görüntüleyici' })[Store.state.role] : 'yetkisiz hesap'}` : 'Ziyaretçi (giriş yapılmadı)'] : ['Veri konumu', Store.state.storageOk ? 'Bu cihazdaki yerel depolama' : 'Depolama kullanılamıyor'],
        ].map(([k, v]) => h('div', null, h('dt', null, k), h('dd', null, v))))),
        accountCard(),
        accessCard(),
        ...KINDS.map(([kind, title]) => UI.card(title, h('ul', { class: 'lookups' }, Store.lookups(kind).map((l) => h('li', null, h('span', null, l.name), admin ? h('div', { class: 'row-actions' }, UI.iconBtn('edit', `${l.name} adını düzenle`, () => lookupForm(kind, l)), UI.iconBtn('trash', `${l.name} sil`, () => lookupDel(l), 'danger')) : null))),
          admin ? UI.btn('Ekle', { ic: 'plus', small: true, onclick: () => lookupForm(kind, null) }) : null)),
        internal ? UI.card('Yedekleme ve dışa aktarma', h('div', null,
          h('p', { class: 'muted small' }, remote ? 'Ortak veritabanının güncel görüntüsünü JSON olarak indirir. Düzenli yedek almanız önerilir.' : 'Veriler yalnızca bu cihazda durur; düzenli JSON yedeği alın.'),
          h('div', { class: 'btn-row' },
            UI.btn('JSON yedeği indir', { ic: 'download', variant: 'primary', onclick: () => { U.download(`kuft-yedek-${U.todayISO()}.json`, JSON.stringify(Store.exportJSON(), null, 2), 'application/json'); UI.toast('Yedek indirildi.'); } }),
            admin ? UI.btn('Yedekten geri yükle', { ic: 'upload', onclick: importJSON }) : null),
          h('h4', null, 'Tablo olarak dışa aktar'),
          h('div', { class: 'btn-row' }, datasets().map((d) => UI.btn(d.name + ' (CSV)', { small: true, onclick: () => U.download(`${d.key}-${U.todayISO()}.csv`, U.toCSV(d.columns, d.rows), 'text/csv;charset=utf-8') })),
            UI.btn('Tümü (Excel)', { small: true, ic: 'download', onclick: async () => { try { await U.downloadXLSX(`kuft-tum-veriler-${U.todayISO()}.xlsx`, datasets().map((d) => ({ name: d.name, columns: d.columns, rows: d.rows }))); } catch (e) { UI.toast(e.message, 'error'); } } })))) : null,
        admin ? UI.card('Örnek veriler', h('div', null,
          h('p', null, `Başlangıçta yüklenen örnek kayıtlardan değiştirilmemiş olanlar: ${sampleN}.`),
          h('p', { class: 'muted small' }, 'Düzenlediğiniz kayıtlar gerçek veri sayılır ve silinmez. Örnek etkinlikler silinirse bağlı görevler de silinir.'),
          h('div', { class: 'btn-row' }, UI.btn('Örnek verileri temizle', { ic: 'trash', variant: 'danger-ghost', disabled: !sampleN, onclick: async () => {
            if (!(await UI.confirmBox({ title: 'Örnek verileri temizle', message: `${sampleN} değiştirilmemiş örnek kayıt silinecek. Bu işlem geri alınamaz.`, okLabel: 'Temizle', danger: true }))) return;
            try { const n = await Store.purgeSamples(); UI.toast(`${n} örnek kayıt silindi.`); } catch (e) { /* bildirildi */ }
          } }),
          !remote ? UI.btn('Her şeyi sıfırla (örnek veriyle yeniden başla)', { variant: 'danger-ghost', onclick: async () => { if (await UI.confirmBox({ title: 'Sıfırla', message: 'Bu cihazdaki TÜM veriler silinip örnek veri yeniden yüklenecek. Emin misiniz?', okLabel: 'Sıfırla', danger: true })) { await Store.resetLocal(); UI.toast('Sıfırlandı.'); } } }) : null))) : null));
  }
  return { render };
})();

</script>
  <script>
/* js/app.js */
/* Uygulama kabuğu: yönlendirme, tema, giriş, başlatma */
'use strict';
const App = (() => {
  const { h, clear } = U;
  const ROUTES = {
    dashboard: { title: 'Genel bakış', view: () => DashboardView, icon: 'calendar' },
    events: { title: 'Etkinlikler', view: () => EventsView },
    calendar: { title: 'Takvim', view: () => CalendarView },
    tasks: { title: 'Görevler', view: () => TasksView },
    team: { title: 'Yönetim kurulu', view: () => TeamView },
    support: { title: 'Üniversite destekleri', view: () => SupportView, internal: true },
    reports: { title: 'Raporlar', view: () => ReportsView },
    settings: { title: 'Ayarlar', view: () => SettingsView },
  };
  let current = 'dashboard';

  const routeFromHash = () => { const k = (location.hash || '').replace(/^#\/?/, ''); return ROUTES[k] ? k : 'dashboard'; };
  const go = (k) => { if (location.hash === '#/' + k) render(); else location.hash = '#/' + k; };

  // ---- tema ----
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('kuft.theme', t); } catch (e) { /* yoksay */ }
    const b = document.getElementById('theme-btn');
    if (b) { U.put(clear(b), UI.icon(t === 'dark' ? 'sun' : 'moon')); b.setAttribute('aria-label', t === 'dark' ? 'Açık temaya geç' : 'Koyu temaya geç'); }
  }
  function initTheme() {
    let t = null;
    try { t = localStorage.getItem('kuft.theme'); } catch (e) { /* yoksay */ }
    if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    setTheme(t);
  }

  // ---- giriş / hesap oluşturma ----
  const switchLink = (text, label, onclick) => h('p', { class: 'auth-switch' }, text + ' ', h('button', { class: 'link-btn', type: 'button', onclick }, label));
  function attachSwitch(dlg, el) {
    const form = dlg.querySelector('form'); const actions = form && form.querySelector('.form-actions');
    if (actions) form.insertBefore(el, actions);
  }
  function loginDialog() {
    if (Store.state.mode !== 'remote') return UI.toast('Yerel modda giriş gerekmez.');
    const dlg = UI.form({
      title: 'Giriş yap', size: 'sm', submitLabel: 'Giriş yap',
      intro: 'Yönetim kurulu üyeleri kendi e-posta ve şifreleriyle giriş yapar.',
      fields: [
        { key: 'email', label: 'E-posta', type: 'email', required: true, autocomplete: 'username' },
        { key: 'password', label: 'Şifre', type: 'password', required: true, autocomplete: 'current-password' },
      ],
      onSubmit: async (v) => {
        await Store.signIn(v.email.toLowerCase(), v.password);
        if (!Store.state.role) UI.toast('Giriş yapıldı ancak e-postanız yetkili kişiler listesinde değil. Topluluk başkanına başvurun.', 'error');
        else UI.toast('Hoş geldiniz' + (Store.state.user.name ? ', ' + Store.state.user.name : '') + '.');
      },
    });
    attachSwitch(dlg, switchLink('Hesabınız yok mu?', 'Hesap oluşturun', () => { dlg.close(); signUpDialog(); }));
  }
  function signUpDialog() {
    if (Store.state.mode !== 'remote') return UI.toast('Yerel modda hesap gerekmez.');
    const dlg = UI.form({
      title: 'Hesap oluştur', size: 'sm', submitLabel: 'Hesabı oluştur',
      intro: 'Topluluk başkanının yetkili kişiler listesine eklediği e-posta adresinizle kendi şifrenizi belirleyin. Hesap hemen açılır.',
      fields: [
        { key: 'full_name', label: 'Ad soyad', type: 'text', required: true, autocomplete: 'name' },
        { key: 'email', label: 'E-posta', type: 'email', required: true, autocomplete: 'username' },
        { key: 'password', label: 'Şifre', type: 'password', required: true, autocomplete: 'new-password', help: 'En az 6 karakter.' },
        { key: 'password2', label: 'Şifre (tekrar)', type: 'password', required: true, autocomplete: 'new-password' },
      ],
      validate: (v) => {
        const e = {};
        if (v.password && v.password.length < 6) e.password = 'Şifre en az 6 karakter olmalı.';
        if (v.password2 && v.password !== v.password2) e.password2 = 'Şifreler aynı değil.';
        return e;
      },
      onSubmit: async (v) => {
        await Store.signUp(v.email, v.password, v.full_name);
        UI.toast(Store.state.role ? 'Hesabınız açıldı, hoş geldiniz.' : 'Hesap açıldı ancak yetki tanımlanamadı. Topluluk başkanına başvurun.', Store.state.role ? 'ok' : 'error');
      },
    });
    attachSwitch(dlg, switchLink('Zaten hesabınız var mı?', 'Giriş yapın', () => { dlg.close(); loginDialog(); }));
  }
  async function logout() { try { await Store.signOut(); UI.toast('Çıkış yapıldı.'); } catch (e) { UI.toast(e.message, 'error'); } }

  // ---- kabuk ----
  function renderShell() {
    const s = Store.settings();
    document.title = (s.name || 'Topluluk') + ' · Yönetim';
    const brand = document.getElementById('brand');
    U.put(clear(brand), 
      s.logo_url && (U.isUrl(s.logo_url) || s.logo_url.startsWith('data:image/')) ? h('img', { class: 'brand-logo', src: s.logo_url, alt: '' }) : UI.icon('aperture', 28),
      h('span', { class: 'brand-name' }, s.name));
    const nav = document.getElementById('nav');
    U.put(clear(nav), Object.entries(ROUTES).filter(([, r]) => !r.internal || Store.internal()).map(([k, r]) =>
      h('a', { href: '#/' + k, class: 'nav-link' + (k === current ? ' on' : ''), 'aria-current': k === current ? 'page' : null, onclick: () => closeNav() }, r.title)));
    const auth = document.getElementById('auth');
    clear(auth);
    const st = Store.state;
    if (st.mode === 'local') U.put(auth, h('span', { class: 'mode-pill', title: 'Veriler yalnızca bu cihazda saklanır' }, 'Yerel prototip'));
    else if (st.user) U.put(auth, h('span', { class: 'user-pill', title: st.user.email }, UI.icon('user', 16), h('span', null, st.role ? ({ admin: 'Yönetici', editor: 'Editör', viewer: 'Görüntüleyici' })[st.role] : 'Yetkisiz')), UI.btn('Çıkış', { small: true, onclick: logout }));
    else U.put(auth, h('span', { class: 'mode-pill view', title: 'Salt okunur görünüm' }, UI.icon('eye', 14), 'Ziyaretçi'), UI.btn('Giriş yap', { small: true, variant: 'primary', ic: 'lock', onclick: loginDialog }));
    const note = document.getElementById('banner');
    clear(note);
    if (st.mode === 'remote' && st.user && !st.role) { note.hidden = false; note.append('E-postanız yetkili kişiler listesinde değil; yalnızca herkese açık bilgileri görebilirsiniz. Topluluk başkanından sizi Ayarlar > Yetkili kişiler listesine eklemesini isteyin.'); }
    else if (st.mode === 'local') { note.hidden = false; note.append('Yerel prototip modu: veriler yalnızca bu cihazda saklanır ve başkalarıyla paylaşılmaz. Ortak kullanım için README\'deki Supabase kurulumunu yapın. '); }
    else note.hidden = true;
  }

  function render() {
    if (!Store.state.ready) return;
    current = routeFromHash();
    const view = document.getElementById('view');
    const active = document.activeElement;
    const keep = active && active.id && view.contains(active) ? { id: active.id, s: active.selectionStart, e: active.selectionEnd } : null;
    renderShell();
    clear(view);
    try { ROUTES[current].view().render(view); }
    catch (e) { console.error(e); U.put(clear(view), UI.card('Bir hata oluştu', h('div', null, h('p', null, 'Bu bölüm görüntülenemedi: ' + e.message), UI.btn('Yeniden dene', { onclick: render })))); }
    if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus(); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (err) { /* yoksay */ } } }
    document.getElementById('main').dataset.route = current;
  }

  function closeNav() { document.body.classList.remove('nav-open'); const b = document.getElementById('menu-btn'); if (b) b.setAttribute('aria-expanded', 'false'); }

  async function start() {
    initTheme();
    Store.hooks.notify = UI.toast;
    document.getElementById('theme-btn').addEventListener('click', () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
    const mb = document.getElementById('menu-btn');
    U.put(clear(mb), UI.icon('menu'));
    mb.addEventListener('click', () => { const open = document.body.classList.toggle('nav-open'); mb.setAttribute('aria-expanded', String(open)); });
    document.getElementById('scrim').addEventListener('click', closeNav);
    const view = document.getElementById('view');
    U.put(clear(view), UI.loading('Veriler yükleniyor…'));
    try {
      await Store.init();
    } catch (e) {
      console.error(e);
      U.put(clear(view), UI.card('Veriler yüklenemedi', h('div', null, h('p', null, Store.friendly(e)), h('p', { class: 'muted small' }, 'Supabase adresi/anahtarı (js/config.js) ve şema kurulumunu kontrol edin.'), UI.btn('Yeniden dene', { variant: 'primary', onclick: () => location.reload() }))));
      return;
    }
    Store.on(render);
    window.addEventListener('hashchange', () => { closeNav(); render(); window.scrollTo(0, 0); });
    render();
  }
  return { start, render, go, setTheme, loginDialog, signUpDialog, ROUTES };
})();
document.addEventListener('DOMContentLoaded', App.start);

</script>
